apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.jakewharton.butterknife'
apply plugin: 'debounce-plugin'
apply plugin: 'com.android.application'

android {
    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_PATH') ?: project.findProperty('KEYSTORE_PATH') ?: '../../ScreenA400.keystore'
            def keystorePassword = System.getenv('KEYSTORE_PASSWORD') ?: project.findProperty('KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('KEY_ALIAS') ?: project.findProperty('KEY_ALIAS') ?: 'key0'
            def keyPasswordValue = System.getenv('KEY_PASSWORD') ?: project.findProperty('KEY_PASSWORD')
            storeFile file(keystorePath)
            storePassword keystorePassword ?: ''
            keyAlias keyAliasValue
            keyPassword keyPasswordValue ?: ''
        }
    }

    defaultConfig {
        versionName "1.8.0"
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "fabscreen-a400_${variant.versionName}_${output.getFilter(com.android.build.OutputFile.ABI)}_${variant.name}.apk"
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    packagingOptions {
        // This is an Android/ARM PIE executable launched from nativeLibraryDir,
        // not a JNI library. Re-stripping it can invalidate its Go build.
        doNotStrip '**/libobicopeer.so'
    }

    splits {
        abi {
            enable true
            reset()
            include "x86_64", "armeabi-v7a"
        }
    }
}

task verifyObicoPeerBinary {
    doLast {
        def sourceRoot = rootProject.file('platform/base/obico-webrtc')
        def binary = file('libs/armeabi-v7a/libobicopeer.so')
        def manifest = file('libs/armeabi-v7a/libobicopeer.sha256')
        if (!binary.isFile() || !manifest.isFile()) {
            throw new GradleException('Obico peer missing; run platform/base/obico-webrtc/build-android.ps1')
        }
        def sha256 = { byte[] bytes ->
            java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        }
        def sourceFiles = fileTree(dir: sourceRoot, includes: ['**/*.go', '**/go.mod', '**/go.sum'])
                .files.toList().sort { a, b ->
                    sourceRoot.toPath().relativize(a.toPath()).toString() <=>
                            sourceRoot.toPath().relativize(b.toPath()).toString()
                }
        def sourceLines = sourceFiles.collect { source ->
            def relative = sourceRoot.toPath().relativize(source.toPath()).toString().replace('\\', '/')
            "${relative} ${sha256(source.bytes)}"
        }
        def sourceDigest = sha256((sourceLines.join('\n') + '\n').getBytes('UTF-8'))
        def expected = [:]
        manifest.eachLine { line ->
            def fields = line.split('=', 2)
            if (fields.length == 2) expected[fields[0]] = fields[1]
        }
        if (expected.source_sha256 != sourceDigest || expected.binary_sha256 != sha256(binary.bytes)) {
            throw new GradleException("Obico peer binary is stale (source ${sourceDigest}, binary ${sha256(binary.bytes)}); run platform/base/obico-webrtc/build-android.ps1")
        }
    }
}
preBuild.dependsOn verifyObicoPeerBinary

debounce {
    isDebug = true
    checkTime = 300
    generateReport = true
    includeForMethodAnnotation = ["Lbutterknife/OnClick;",
                                  "Lbutterknife/OnItemClick;",
                                  "Lbutterknife/OnCheckedChanged;"]
}

dependencies {
    implementation project(":platform:lib")
    implementation project(":platform:base")
    implementation project(":platform:core")
    implementation project(":features:settings")
    implementation project(":features:machine-tools")
    implementation project(":features:remote")
    implementation project(":features:print")
    implementation project(":features:guide")
    implementation project(":features:file-manager")
    implementation project(":features:add-ons")
    implementation project(":features:welcome")
    implementation project(":features:home")
    implementation project(":ijkplayer_java")
    implementation Libs.INSTANCE.logger
    implementation Libs.INSTANCE.junit
    implementation Libs.INSTANCE.ARouter
    annotationProcessor Libs.INSTANCE.ARouterAnnotation
    implementation Libs.INSTANCE.appCompat
    implementation Libs.INSTANCE.constraintLayout
    implementation Libs.INSTANCE.material
    implementation Libs.INSTANCE.rxjava
    implementation Libs.INSTANCE.rxAndroid
    implementation Libs.INSTANCE.butterknife
    annotationProcessor Libs.INSTANCE.butterknifeAnnotation
    implementation Libs.INSTANCE.okio
    implementation Libs.INSTANCE.autoDispose
    implementation Libs.INSTANCE.autoDisposeArchComponents
    implementation Libs.INSTANCE.autoDisposeLifecycle
    implementation Libs.INSTANCE.firebaseAnalytics
    implementation Libs.INSTANCE.firebaseCrashlytics
    implementation platform(Libs.INSTANCE.firebaseBOM)
    implementation Libs.INSTANCE.localization
    implementation Libs.INSTANCE.debounce
}
